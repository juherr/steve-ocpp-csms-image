---
# Build & push the SteVe image (OCPP CSMS) to GHCR.
#
# Runs on GitHub-hosted runners, never on a self-hosted one: this repository is
# public, so a pull request from a fork would otherwise execute arbitrary code
# on our own machine. Hosted runners are free and unlimited on public repos.
#
# One build per architecture, each native on its own runner (`ubuntu-latest`
# for amd64, `ubuntu-24.04-arm` for arm64), probed there, and — on `release` —
# pushed by digest; the `publish` job then merges the two digests into the one
# `steve-X.Y.Z` tag, an image index. Route B of #27, measured before being
# chosen: emulating arm64 on the amd64 runner would have been one job instead
# of two, but Maven, jOOQ and the migration scenarios would never have run on
# arm64, and an arm64 breakage would not have failed a pull request.
#
# SteVe runs its jOOQ code generation and its Flyway migrations against a LIVE
# database during `mvn package`. Each job therefore starts a throwaway MariaDB
# that publishes 3306 on its runner, and builds through a `docker-container`
# builder created with `--driver-opt network=host`: buildkitd itself sits on
# the runner's network, so the RUN steps reach the database on 127.0.0.1 with
# no `--network` flag. Why that builder and not the daemon's default one: the
# `docker` driver refuses push-by-digest ("not implemented for docker driver",
# measured), and pushing by digest is what lets one tag be assembled from two
# runners. Why not the `network.host` entitlement instead: under it,
# `--network=host` means the buildkitd *container's* namespace — Maven got
# "connection refused" on 127.0.0.1 on both runners. See the README for the
# exact same commands, runnable locally.
#
# No secret ever enters the image: sensitive configuration is injected at
# runtime through environment variables (Spring externalized config).

name: Build SteVe image

on:
  # Publishing is a push to `release`, and nothing else publishes.
  #
  # It used to happen on every merge to `main` touching the packaging, which
  # conflated two different events: "the packaging changed" and "a release
  # should go out". A typo fixed in a comment republished steve-X.Y.Z under a
  # new digest — the tag moved while nothing about the image had.
  #
  # A branch rather than a button: shipping becomes `git push origin
  # main:release`, an act with a record, and "what is waiting to ship" is
  # answerable offline with `git log release..main`. It also removes the last
  # duplicated pin — with no dispatch input to carry a version, the Dockerfile's
  # ARG is the only place the release is written in code.
  push:
    branches:
      - release
  # Re-run a publish without a new commit — a failed run, a registry hiccup.
  # Select the `release` branch when dispatching; the publish steps below refuse
  # to run from anywhere else.
  workflow_dispatch:
  # Pull requests run the whole build on both architectures, minus the login,
  # the push and the merge: it is the only thing standing between an
  # unbuildable change and `main`.
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "entrypoint.sh"
      - "flyway-callbacks/**"
      - "hack/migration-test.sh"
      - "hack/k8s-example-test.sh"
      - "examples/kubernetes/**"
      - "hack/image-config.sh"
      - "hack/check-pushed-digest.sh"
      - "hack/publish-index.sh"
      - ".github/workflows/build-image.yml"

# Read-only for the workflow; `packages: write` is granted per job below, on
# the two that push to GHCR on `release`.
permissions:
  contents: read

concurrency:
  # Releases queue rather than cancel each other; pull request runs supersede
  # their own previous run.
  group: steve-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/juherr/steve
  # Throwaway MariaDB, once for the code generation and twice more, started
  # empty, by hack/migration-test.sh — one instance the fresh and restart
  # scenarios share, one the upgrade scenario writes with the previous release
  # first (same defaults as application-docker.properties). Its credentials
  # only serve the build: no data, no secret, nothing of it reaches the image.
  # renovate: datasource=docker depName=mariadb
  DB_IMAGE: "mariadb:11.8"
  # The builder every `docker buildx build` below goes through. Its buildkit
  # image is deliberately not pinned: it is a build tool, like the runner's
  # Engine and buildx, which were never pinned either — not a component of the
  # image, whose base images are.
  BUILDER: steve-builder
  # The mirror to Docker Hub is a copy, not a build, and the tool that copies
  # an index across registries verbatim is crane — `imagetools create` cannot,
  # its sources must already sit in the destination registry (its reference).
  # Pinned and Renovate-managed like the linters: it decides what lands on
  # Docker Hub, which is closer to a component than to a build tool.
  # renovate: datasource=docker depName=gcr.io/go-containerregistry/crane
  CRANE_IMAGE: "gcr.io/go-containerregistry/crane:v0.22.1"

jobs:
  build:
    name: build & probe (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      # A pull request must report both architectures, not stop at the first.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      ARCH: ${{ matrix.arch }}
    # Each job writes only its own digest_<arch>; the other key stays unset in
    # that job, and GitHub merges the two — measured on the #27 spike.
    outputs:
      steve_ref: ${{ steps.ref.outputs.steve_ref }}
      digest_amd64: ${{ steps.digest.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.digest.outputs.digest_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The release comes from the Dockerfile's own ARG — the single place it is
      # pinned in code, so the version a branch would ship and the version its
      # build tests cannot disagree. Validated against a strict format before it
      # reaches any shell command below.
      #
      # BUILD_DATE is fixed here, once per job: it feeds a LABEL, and the
      # push-by-digest export at the end must be a cache hit of the build that
      # was probed, which it is only with identical inputs.
      #
      # The runner label is asserted against the architecture it is supposed
      # to be, so a label that quietly changed meaning fails here and not as a
      # wrong platform inside the published index.
      - name: Resolve and validate the SteVe tag
        id: ref
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG STEVE_REF=//p' Dockerfile | head -1)
          if ! printf '%s' "$ref" | grep -Eq '^steve-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid ARG STEVE_REF in Dockerfile: '$ref' (expected steve-X.Y.Z)"; exit 1
          fi
          actual=$(docker version --format '{{ .Server.Arch }}')
          if [ "${actual}" != "${ARCH}" ]; then
            echo "This runner is ${actual}, the matrix says ${ARCH}."; exit 1
          fi
          echo "steve_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Published on 0.0.0.0 rather than the loopback so that the documented
      # fallback (`--add-host …:host-gateway`, no host networking) also works
      # without touching this step. The runner is ephemeral and firewalled.
      - name: Start the throwaway MariaDB (jOOQ/Flyway code generation)
        run: |
          set -euo pipefail
          docker run -d --name steve-build-db \
            -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=root \
            -e MARIADB_DATABASE=stevedb \
            -e MARIADB_USER=steve \
            -e MARIADB_PASSWORD=changeme \
            -e TZ="+00:00" \
            "${DB_IMAGE}" --innodb-use-native-aio=0

      - name: Wait for the database to be ready
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker exec steve-build-db \
                 healthcheck.sh --connect --innodb_initialized; then
              echo "Database ready."; exit 0
            fi
            echo "Database not ready yet ($i/60)…"; sleep 2
          done
          echo "Timeout: the build database never became ready."; exit 1

      # See the header for why this builder. `--bootstrap` starts buildkitd
      # now, so that a builder that cannot come up fails here, by name.
      - name: Create the builder
        run: |
          set -euo pipefail
          docker buildx create --name "${BUILDER}" --driver docker-container --driver-opt network=host
          docker buildx inspect --bootstrap --builder "${BUILDER}"

      # Fails in seconds with a clear message instead of after eight minutes of
      # Maven, should the build sandbox not reach the database. Through the
      # same builder as the build, or it would probe a path the build does not
      # take.
      - name: Probe build sandbox networking
        run: |
          set -euo pipefail
          printf 'FROM alpine\nRUN nc -z -w3 127.0.0.1 3306 && echo REACHABLE\n' \
            | docker buildx build --builder "${BUILDER}" --progress=plain -

      # `--load` puts the result in the daemon, where the probes below run it.
      # 127.0.0.1 and not localhost: on the host network localhost may resolve
      # to ::1 first, while the published MariaDB listens on IPv4.
      - name: Build the image
        env:
          STEVE_REF: ${{ steps.ref.outputs.steve_ref }}
          BUILD_DATE: ${{ steps.ref.outputs.build_date }}
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "${BUILDER}" \
            --build-arg STEVE_REF="${STEVE_REF}" \
            --build-arg DB_IP=127.0.0.1 \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --load -t "${IMAGE}:${STEVE_REF}" \
            .

      # The recommended Compose healthcheck shells out to curl inside the
      # container; make sure the runtime stage really ships it.
      - name: Validate healthcheck dependency
        env:
          STEVE_REF: ${{ steps.ref.outputs.steve_ref }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint curl "${IMAGE}:${STEVE_REF}" --version >/dev/null

      # The upgrade scenario needs the image users would be coming from: the
      # highest published tag strictly below the one being built. Strictly —
      # a Temurin bump rebuilds a tag that is already published, and "the
      # latest published" would then upgrade the schema from itself. Read from
      # the registry, which answers with no credentials for a public package;
      # the REST packages endpoint is scoped to the user account and would not
      # answer the workflow's GITHUB_TOKEN. Nothing below the current tag —
      # the very first release — skips the scenario with a notice, never
      # silently. GHCR unreachable fails the step: a check that quietly drops
      # its coverage is worse than a re-run.
      #
      # Then, does that tag exist for this runner's architecture? Releases
      # before the first multi-arch one are amd64 only, and `docker run` of
      # an amd64 image on the arm64 runner would fail with an exec format
      # error, not with a migration finding. The helper answers for the
      # runner's own architecture; a tag that lacks it answers with another
      # one, and the scenario is skipped on this runner with a notice. The
      # amd64 runner still runs it, and from the second multi-arch release on
      # both do.
      - name: Resolve the previous published release
        id: previous
        env:
          STEVE_REF: ${{ steps.ref.outputs.steve_ref }}
        run: |
          set -euo pipefail
          repo="${IMAGE#ghcr.io/}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
            | jq -r .token)
          previous=$(curl -fsS -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/${repo}/tags/list?n=1000" \
            | jq -r --arg current "${STEVE_REF}" '
                def v: ltrimstr("steve-") | split(".") | map(tonumber);
                [(.tags // [])[] | select(test("^steve-[0-9]+\\.[0-9]+\\.[0-9]+$")) | select(v < ($current | v))]
                | sort_by(v) | last // empty')
          if [ -z "${previous}" ]; then
            echo "::notice::No published release below ${STEVE_REF} — the upgrade scenario will be skipped."
          else
            arch=$(IMAGE_ARCH="${ARCH}" ./hack/image-config.sh "${previous}" | jq -r '.architecture // empty')
            if [ "${arch}" = "${ARCH}" ]; then
              echo "Previous release: ${previous} (linux/${ARCH})"
            else
              echo "::notice::${previous} has no linux/${ARCH} manifest (found '${arch}') — the upgrade scenario is skipped on this runner."
              previous=''
            fi
          fi
          echo "previous_image=${previous:+${IMAGE}:${previous}}" >> "$GITHUB_OUTPUT"

      # The script's failure path is what makes a red step readable, and the
      # Cleanup step below would hide a cleanup bug in it. So first, a forced
      # failure: a container that exits at once (alpine with no command, pulled
      # by `docker run` itself — the probe above fetched it into the builder,
      # not the daemon) must fail the script, print the database's log, and
      # leave nothing behind — checked here, before the fallback cleanup gets a
      # chance to. Seconds, since nothing boots.
      - name: Check migration-test.sh fails loudly and leaves nothing behind
        run: |
          set -euo pipefail
          if out=$(./hack/migration-test.sh alpine 2>&1); then
            echo "migration-test.sh passed a container that exits at once"; exit 1
          fi
          grep -q 'FAIL: .* exited before becoming healthy' <<<"${out}"
          grep -q 'docker logs steve-it-.*-db' <<<"${out}"
          [ -z "$(docker ps -aq --filter 'label=steve-it')" ] || { echo "containers left behind"; exit 1; }
          [ -z "$(docker network ls -q --filter 'label=steve-it')" ] || { echo "network left behind"; exit 1; }

      # `flyway version` in the Dockerfile only proves the pruned CLI still
      # loads — on the Flyway image's own JDK, with no database. Everything
      # else is this: the real entrypoint on the runtime JRE, through the one
      # driver kept, against a database that starts EMPTY — the build database
      # would not do, Maven has already migrated it. An empty schema must
      # migrate and SteVe must become healthy; a second container on that
      # schema must be a Flyway no-op; and the previous published release's
      # schema must be upgraded by this image. The script prints every log on
      # failure. It is the same command as under "Building locally" in the
      # README, so a red step reproduces on a laptop — including the MariaDB
      # image, which the script reads from DB_IMAGE above rather than being
      # handed here, so that the path a laptop takes is the path CI tests.
      - name: Migrate a fresh database, restart, upgrade
        env:
          STEVE_REF: ${{ steps.ref.outputs.steve_ref }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.previous_image }}
        run: |
          set -euo pipefail
          ./hack/migration-test.sh "${IMAGE}:${STEVE_REF}" ${PREVIOUS_IMAGE:+"${PREVIOUS_IMAGE}"}

      # The Kubernetes example, against this very image: kubeconform in
      # lint.yml proves the manifests are valid, this proves a pod comes up
      # under them — read-only root filesystem, dropped capabilities, probes,
      # Service — with the database started in-cluster, empty. The image is
      # loaded into a kind cluster rather than pulled: for a tag not yet
      # published it is the only one there is, and it is the one that would
      # ship. On the amd64 job alone: the manifest is the same on both
      # architectures and the image has already been probed on each. kind and
      # kubectl ship with the runner image, unpinned like its Engine and
      # buildx — test tools, not components of the image.
      - name: Bring the Kubernetes example up on this image
        if: matrix.arch == 'amd64'
        env:
          STEVE_REF: ${{ steps.ref.outputs.steve_ref }}
        run: |
          set -euo pipefail
          ./hack/k8s-example-test.sh "${IMAGE}:${STEVE_REF}"

      - name: Login to GHCR
        if: github.ref_name == 'release'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      # The same build, same builder, same inputs, exported again by digest —
      # a cache hit of a few seconds (measured: 6–7 s), so what is pushed is
      # what was probed above. Checked rather than assumed, by
      # hack/check-pushed-digest.sh: the pushed manifest's config, read back
      # from the registry, must carry the loaded image's layers. The export
      # itself has no offline test — it needs buildx and a registry — and
      # rests on the #27 spike (three runs) and a local registry:2 run; its
      # one contract used here is `containerimage.digest` in the metadata
      # file, which both showed.
      #
      # `--provenance=false`: the docker-container driver otherwise attaches an
      # attestation, which makes each pushed "platform digest" a small index of
      # its own, and the merged tag shows two `unknown/unknown` entries next to
      # the platforms (measured). Attestations are ruled out in AGENTS.md.
      #
      # No tag here: the tag is the index the `publish` job assembles, and a
      # per-platform tag would fragment the namespace that has one tag per
      # SteVe release.
      - name: Push by digest
        id: digest
        if: github.ref_name == 'release'
        env:
          STEVE_REF: ${{ steps.ref.outputs.steve_ref }}
          BUILD_DATE: ${{ steps.ref.outputs.build_date }}
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "${BUILDER}" \
            --build-arg STEVE_REF="${STEVE_REF}" \
            --build-arg DB_IP=127.0.0.1 \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --provenance=false \
            --output "type=image,push=true,push-by-digest=true,name-canonical=true,name=${IMAGE}" \
            --metadata-file "${RUNNER_TEMP}/push.json" \
            .
          digest=$(jq -r '."containerimage.digest" // empty' "${RUNNER_TEMP}/push.json")
          [ -n "${digest}" ] || { echo "no containerimage.digest in the build metadata"; exit 1; }
          ./hack/check-pushed-digest.sh "${IMAGE}:${STEVE_REF}" "${digest}"
          echo "digest_${ARCH}=${digest}" >> "$GITHUB_OUTPUT"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f steve-build-db || true
          docker ps -aq --filter 'label=steve-it' | xargs -r docker rm -f || true
          docker network ls -q --filter 'label=steve-it' | xargs -r docker network rm || true
          kind get clusters 2>/dev/null | grep '^steve-k8s-' | xargs -r -n1 kind delete cluster --name || true
          docker buildx rm "${BUILDER}" || true
          docker logout ghcr.io || true

  # One tag per SteVe release, and nothing else: an index of the two platform
  # digests. The JRE is a build detail recorded in the image (see the README),
  # not part of the tag: a JRE bump is not a new SteVe release and must not
  # fragment the tag namespace. No `latest`, and no `sha-${GITHUB_SHA}` tag:
  # the latter WOULD add a stored version per build, for no benefit —
  # consumers pin by digest, the index's.
  #
  # `needs` waits for both builds to succeed. One failing after the other
  # pushed leaves an untagged digest on GHCR and moves no tag — re-run the
  # workflow from `release` and the next pair replaces it. The same holds
  # for a candidate the script refuses: the tag is made only after the
  # checks, so the platform digests are on GHCR before this job is green,
  # the tag never before it is.
  publish:
    name: publish the index
    needs: build
    if: github.ref_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      STEVE_REF: ${{ needs.build.outputs.steve_ref }}
      DIGEST_AMD64: ${{ needs.build.outputs.digest_amd64 }}
      DIGEST_ARM64: ${{ needs.build.outputs.digest_arm64 }}
    # The index digest, for the mirror job: what it copies must be what was
    # just made, not whatever the tag resolves to by then.
    outputs:
      index_digest: ${{ steps.publish.outputs.index_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A digest that did not arrive must not become an index of one platform.
      - name: Check both digests arrived
        run: |
          set -euo pipefail
          for var in STEVE_REF DIGEST_AMD64 DIGEST_ARM64; do
            [ -n "${!var}" ] || { echo "${var} is empty — the build job did not hand it over."; exit 1; }
          done
          echo "amd64: ${DIGEST_AMD64}"
          echo "arm64: ${DIGEST_ARM64}"

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      # The tag is made from the two digests, checked, and printed by the
      # script — in a file so that the release-only path has tests
      # (hack/test/release-publish.sh) rather than a first run at release
      # time. The revision every platform must carry is this commit's.
      - name: Publish the index
        id: publish
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: ./hack/publish-index.sh "${STEVE_REF}" "${DIGEST_AMD64}" "${DIGEST_ARM64}"

      - name: Cleanup
        if: always()
        run: docker logout ghcr.io || true

  # The same index, on Docker Hub — a mirror for the people who look there
  # first; GHCR stays the canonical registry and the one every check above
  # reads. Nothing is built: hack/mirror-tag.sh copies the index the job
  # above made, by digest, and reads it back — same digest to pin on both
  # registries. Its own job rather than a step of `publish`, for two reasons:
  # the Docker Hub token is then held by a job with no image, no build and no
  # GHCR write; and "Re-run failed jobs" re-runs this one alone, with the
  # outputs of `publish` intact — a Docker Hub outage costs a re-run of the
  # copy, not of the build. A failure here is a red run, not a note: the
  # README promises the tag on both registries.
  #
  # Nothing in the script needs `packages`; the checkout reads the pin. The
  # two secrets reach the script through the environment, as `docker login`
  # above takes GITHUB_TOKEN, and never touch the daemon: crane logs itself
  # in, into a config directory the script makes and removes.
  mirror:
    name: mirror to Docker Hub
    # `build` too, for `steve_ref`: only direct needs are in the context.
    needs: [build, publish]
    if: github.ref_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      STEVE_REF: ${{ needs.build.outputs.steve_ref }}
      INDEX_DIGEST: ${{ needs.publish.outputs.index_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Mirror the index to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: ./hack/mirror-tag.sh "${STEVE_REF}" "${INDEX_DIGEST}"
