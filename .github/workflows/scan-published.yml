---
# Vulnerability scan of the images ALREADY PUBLISHED on GHCR.
#
# Why on a schedule rather than at build time: an image is scanned clean the day
# it is built and says nothing about the day after. What a consumer of
# ghcr.io/juherr/steve actually needs to know is whether the tag they pinned has
# drifted into CVE territory since — which only a recurring scan of the
# published artefact can answer. A build-time scan would have reported on an
# image nobody had to keep, and the release would have gone out anyway.
#
# So this is a monitoring signal, not a gate: it never blocks anything, it tells
# us when a rebuild is worth publishing.
#
# The tags are discovered from the registry instead of being restated here: the
# SteVe release is already pinned in the Dockerfile and echoed in the README,
# which move together (see AGENTS.md); one more copy would rot.
#
# Every supported platform a tag carries is scanned, not just the runner's:
# given an index, Trivy picks the platform matching the runner — linux/amd64 —
# and the arm64 manifest is never looked at. The two are built from the same
# Dockerfile at the same moment, with the same Ubuntu package versions and the
# same jars, so the two reports are expected to be *almost* identical; the
# JRE, libc and everything else compiled per architecture is where "almost"
# lives, and that difference is the thing worth seeing. Scanning amd64 only
# and documenting it was considered and rejected: the scan is report-only,
# halving it saves a few runner minutes a week and buys a blind spot.
# "Supported" is the two platforms the build produces: a third architecture
# added to the build has to be added to hack/scan-targets.sh as well, or it
# ships unscanned.
#
# GitHub disables scheduled workflows after 60 days without repository activity;
# on a packaging repository that can happen between two SteVe releases. If the
# weekly run goes quiet, that is why — re-enable it from the Actions tab.

name: Scan published images

on:
  schedule:
    # Mondays, 06:17 UTC — off the hour, where the runner queues are shorter.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Read-only for the workflow; the one write, `security-events` for the SARIF
# upload, is granted on the job that performs it.
permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: a manual dispatch during the weekly run would
  # abandon a half-uploaded set of SARIF categories, leaving the Security tab
  # showing some tags from this run and others from the previous one.
  group: scan-published
  cancel-in-progress: false

env:
  REGISTRY_REPO: juherr/steve

jobs:
  discover:
    name: list the images to scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      # For hack/scan-targets.sh and the helper it reads through.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Asked to the registry, not to /users/juherr/packages/…: that REST
      # endpoint is scoped to the *user* and needs a personal token with
      # read:packages, which GITHUB_TOKEN is not. The registry answers the same
      # question anonymously because the package is public, so this job needs no
      # permission at all — and no pagination handling, unlike `gh api
      # --paginate`, which emits one JSON document per page and would quietly
      # write a multi-line value to GITHUB_OUTPUT past 30 versions.
      #
      # Which tags, and which platforms of each, is the script's to decide —
      # see its header — so that the answer is proven offline by
      # hack/test/registry-readers.sh rather than by the weekly run. It fails
      # on a tag it cannot read, and so does this job: that is a broken
      # publication, not a scan to skip quietly.
      - name: List the release tags on GHCR and the platforms of each
        id: targets
        run: |
          set -euo pipefail
          matrix=$(./hack/scan-targets.sh)
          echo "Images to scan: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  scan:
    name: trivy ${{ matrix.tag }} linux/${{ matrix.arch }}
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      # A matrix rather than a loop in a single job because upload-sarif is an
      # *action* and each (tag, platform) needs its own `category:`. A `for`
      # loop cannot invoke an action per iteration, so it would force one
      # merged SARIF and lose the per-image view.
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      # renovate: datasource=docker depName=aquasec/trivy
      TRIVY_IMAGE: "aquasec/trivy:0.74.0"
    steps:
      # upload-sarif resolves the commit and ref from the checkout in the
      # workspace; without it the workspace is empty and the upload fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The secret scanner reads the image configuration and build history —
      # where a credential passed through --build-arg or written on a RUN
      # command line would be recorded forever. Verified behaviour; it is not a
      # filesystem-wide sweep, and not a replacement for GitHub's push
      # protection on the sources.
      #
      # Scanned once to JSON, then rendered twice offline. Running `trivy image`
      # per output format would re-pull the ~490 MB image and re-download the
      # vulnerability database for the second render.
      #
      # --platform selects the entry of the index to scan; the runner's own
      # architecture does not matter, Trivy reads the layers, it does not run
      # them. On the single-manifest tags it is a no-op, which is why
      # hack/scan-targets.sh only ever asks for a platform the tag carries.
      - name: Scan ${{ matrix.tag }} linux/${{ matrix.arch }}
        env:
          TAG: ${{ matrix.tag }}
          ARCH: ${{ matrix.arch }}
          # Trivy's own registry-auth variables, for the pull of the image
          # from ghcr.io. Not for its databases: those come from
          # mirror.gcr.io (measured, run 35097055316 — and every run since
          # 0.74.0). The package is public, so this job needs no
          # `packages: read`: the pull succeeded with `contents: read` and
          # `security-events: write` alone, on that run and on every weekly
          # run before it, which had the same token.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/work" -w /work \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "${TRIVY_IMAGE}" image "ghcr.io/${REGISTRY_REPO}:${TAG}" \
              --platform "linux/${ARCH}" \
              --scanners vuln,secret --exit-code 0 \
              --format json --output trivy.json

          docker run --rm -v "${PWD}:/work" -w /work "${TRIVY_IMAGE}" \
            convert --format sarif --output trivy.sarif trivy.json
          # --scanners again on the table render: convert needs to be told which
          # scanners produced the JSON, or it prints "No enabled scanners found"
          # and skips the summary. It does not infer it from the report.
          docker run --rm -v "${PWD}:/work" -w /work "${TRIVY_IMAGE}" \
            convert --scanners vuln,secret \
              --format table --severity HIGH,CRITICAL trivy.json

      # One category per tag and platform, otherwise each upload would overwrite
      # the previous one and the Security tab would only ever show the last
      # image scanned.
      - name: Upload the report to code scanning
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.tag }}-${{ matrix.arch }}
