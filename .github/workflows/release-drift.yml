---
# Is the published image still the packaging that `main` describes?
#
# Publishing is a deliberate act — the build workflow only pushes from
# workflow_dispatch — which trades an automatic release for one that can be
# forgotten. This is the counterweight. It reads the
# org.opencontainers.image.revision label off the newest published tag and asks
# whether any packaging file has changed on `main` since that commit.
#
# It never fails the build. An unreleased packaging change is a legitimate
# state, sometimes for days; a red `main` for it would be crying wolf and would
# be muted within a week. It warns instead — on the merge that introduced the
# drift, and again every Monday for as long as it lasts.
#
# The comparison is scoped to the files whose content ends up in the image.
# Notably it ignores this repository's workflows, including the build one — an
# edit there *can* change the produced image (a new build-arg would), but most
# are orchestration, and a warning that fires on every workflow tweak is a
# warning that gets ignored within a month. That case is left to the human
# reviewing the change, who is the one dispatching the release anyway.

name: Release drift

on:
  push:
    branches:
      - main
  schedule:
    # Mondays, 06:31 UTC — after the published-image scan, same reasoning about
    # off-the-hour runner queues.
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drift
  cancel-in-progress: true

env:
  REGISTRY_REPO: juherr/steve

jobs:
  drift:
    name: published vs main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the comparison walks from the published commit to HEAD,
      # and that commit can be many merges back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compare the published image with the packaging on main
        run: |
          set -euo pipefail

          token=$(curl -fsS \
            "https://ghcr.io/token?scope=repository:${REGISTRY_REPO}:pull&service=ghcr.io" \
            | jq -r .token)

          tag=$(curl -fsS -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/${REGISTRY_REPO}/tags/list?n=1000" \
            | jq -r '[(.tags // [])[] | select(test("^steve-[0-9]+\\.[0-9]+\\.[0-9]+$"))]
                     | sort_by(ltrimstr("steve-") | split(".") | map(tonumber))
                     | last // empty')
          if [ -z "${tag}" ]; then
            echo "Nothing published yet — nothing to compare."; exit 0
          fi

          config=$(curl -fsS -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${REGISTRY_REPO}/manifests/${tag}" | jq -r .config.digest)
          published=$(curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/${REGISTRY_REPO}/blobs/${config}" \
            | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')

          if [ -z "${published}" ] || ! git cat-file -e "${published}^{commit}" 2>/dev/null; then
            echo "::warning::${tag} carries revision '${published}', which is not a commit in this repository — it predates the current history, or was built elsewhere. Cannot compare."
            exit 0
          fi

          # Only the files that reach the image. A README or workflow edit is
          # not a reason to republish.
          ahead=$(git rev-list --count "${published}..HEAD" -- \
            Dockerfile .dockerignore entrypoint.sh flyway-callbacks)

          if [ "${ahead}" -eq 0 ]; then
            echo "In sync: no packaging change since ${tag} was built (${published})."
            exit 0
          fi

          echo "::warning::${tag} was built from ${published}; ${ahead} packaging commit(s) have landed on main since. Run the \"Build SteVe image\" workflow to publish them."
          {
            echo "### Published image is behind \`main\`"
            echo
            echo "\`${tag}\` was built from \`${published}\`."
            echo "\`main\` is at \`$(git rev-parse HEAD)\`, with **${ahead}** packaging commit(s) since:"
            echo
            git log --format='- %h %s' "${published}..HEAD" -- \
              Dockerfile .dockerignore entrypoint.sh flyway-callbacks
            echo
            echo "Publish with the **Build SteVe image** workflow (\`workflow_dispatch\`)."
          } >> "${GITHUB_STEP_SUMMARY}"
