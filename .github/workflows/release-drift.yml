---
# Reports when the published image and the `release` branch have parted
# company. What it compares and why is documented in the script it runs —
# `hack/release-drift.sh`, which is also how you check by hand.
#
# Why these triggers: on a push to `main` because that is when a packaging
# change becomes pending, on a push to `release` because that is when a publish
# is supposed to have happened, and weekly because "supposed to" is exactly what
# needs re-asking a few days later.

name: Release drift

on:
  push:
    branches:
      - main
      - release
  schedule:
    # Mondays, 06:31 UTC — after the published-image scan, same reasoning about
    # off-the-hour runner queues.
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drift
  cancel-in-progress: true

jobs:
  drift:
    name: published vs release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history and every branch: the comparison walks from the published
      # commit to `release`, and that commit can be many merges back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compare the published image with the release branch
        run: ./hack/release-drift.sh
