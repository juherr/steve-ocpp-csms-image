---
# Static checks plus the offline tests — no Docker build, no registry, no
# database. Seconds, not minutes, so this runs on every pull request whatever
# it touches (unlike the image build, which is path-filtered). The one pull
# that is not seconds is Renovate's own image below, ~450 MB (measured), the
# price of the pins being checked by the tool that moves them.
#
# The linters run from their own pinned images instead of third-party actions:
# one less thing to pin by SHA, and the exact command below is runnable locally.
# The one that does not is `docker build --check`, which is the runner's own.

name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=docker depName=hadolint/hadolint
  HADOLINT_IMAGE: "hadolint/hadolint:v2.15.1-alpine"
  # renovate: datasource=docker depName=rhysd/actionlint
  ACTIONLINT_IMAGE: "rhysd/actionlint:1.7.12"
  # renovate: datasource=docker depName=ghcr.io/yannh/kubeconform
  KUBECONFORM_IMAGE: "ghcr.io/yannh/kubeconform:v0.8.0-alpine"
  # renovate: datasource=docker depName=koalaman/shellcheck
  SHELLCHECK_IMAGE: "koalaman/shellcheck:v0.11.0"
  # renovate: datasource=docker depName=renovate/renovate
  RENOVATE_IMAGE: "renovate/renovate:44.94.0"
  # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
  ZIZMOR_IMAGE: "ghcr.io/zizmorcore/zizmor:1.30.1"

jobs:
  lint:
    name: Dockerfile, shell, workflows & manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Every linter below discovers its own inputs, so a second Dockerfile or a
      # second script cannot be added without being checked. The rules waived
      # for the Dockerfile are `# hadolint ignore=` comments on the instructions
      # that earned the waiver, not a repo-wide config.
      - name: hadolint (Dockerfiles)
        run: |
          git ls-files '*Dockerfile*' \
            | xargs -r docker run --rm -v "${PWD}:/repo" -w /repo "${HADOLINT_IMAGE}" hadolint

      # BuildKit's own rule set, the one a build prints as warnings, without the
      # build: it stops after resolving the `FROM` lines — one registry call
      # for their metadata, no layer pulled, no MariaDB — and exits non-zero on
      # a warning (measured). Nothing to pin, it is the runner's Docker.
      - name: docker build --check (Dockerfiles)
        run: |
          git ls-files '*Dockerfile*' \
            | xargs -r -I{} docker build --check -f {} .

      # Pinned rather than the runner's own copy, which lags releases: a
      # directive written for the local 0.11 (SC2329) met the runner's older
      # code for the same finding (SC2317) and left a pull request red — one
      # round trip per rule rename (#33). `koalaman/shellcheck`, not the
      # `-alpine` one: for shellcheck that is a separate image with a shell
      # and no entrypoint (measured), and this step needs neither — the file
      # list goes straight to the binary the image runs.
      - name: shellcheck (shell scripts)
        run: |
          git ls-files '*.sh' \
            | xargs -r docker run --rm -v "${PWD}:/repo" -w /repo "${SHELLCHECK_IMAGE}"

      - name: actionlint (workflows)
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

      # What actionlint does not look at: unpinned actions, permissions broader
      # than the job that needs them, expressions interpolated into a script,
      # and checkouts that leave the token in .git/config for the rest of the
      # job — the invariants AGENTS.md spells out. A finding is a failed step,
      # and a waiver is a comment on the line that earned it, with its reason,
      # like the hadolint ones. --offline: no network call in a pull-request
      # gate, which leaves out the audits that ask GitHub (known-vulnerable-
      # actions, impostor-commit, ref-confusion); the SHA pins are Renovate's
      # to move. The whole tree, not .github/workflows: a composite action
      # added later is found on arrival.
      - name: zizmor (workflows)
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo "${ZIZMOR_IMAGE}" --offline .

      # The Kubernetes example manifests, against the upstream API schemas —
      # `-strict` rejects a misspelt field, which the API server would too but
      # only once someone applies the file. Every YAML under
      # examples/kubernetes/, so a manifest added next to them is checked on
      # arrival — and only there: an example for another tool would not be a
      # Kubernetes resource, and gets its own check when it comes.
      - name: kubeconform (Kubernetes example manifests)
        run: |
          git ls-files 'examples/kubernetes/*.yaml' 'examples/kubernetes/*.yml' \
            | xargs -r docker run --rm -v "${PWD}:/repo" -w /repo "${KUBECONFORM_IMAGE}" -strict -summary

  # The registry readers and the release-only scripts, against fixtures rather
  # than GHCR: the multi-arch shapes the readers must handle are not published
  # under juherr/steve yet, and the publish path runs only on `release` — the
  # release gate should not be the first place either is met. And the one
  # runtime value the README quotes from entrypoint.sh, compared to it, and
  # hack/lint.sh, which runs this file's steps locally by reading them out of
  # it — its suite includes parsing this very file, so a step written in a
  # shape it cannot read is red here, not silently skipped on a laptop. And
  # hack/check-links.sh against a docker shim, and check-links.yml's own
  # step through hack/lint.sh: lychee itself needs the network and runs
  # weekly, the handling of what it returns does not.
  hack-tests:
    name: Registry readers & release scripts (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./hack/test/registry-readers.sh
      - run: ./hack/test/release-publish.sh
      - run: ./hack/test/renovate-extract.sh
      - run: ./hack/test/readme-entrypoint.sh
      - run: ./hack/test/lint-script.sh
      - run: ./hack/test/check-links.sh

  # renovate.json is load-bearing — three regex managers, and a broken one
  # freezes pins silently — and nothing else reads it before Renovate does.
  # First the file itself, with Renovate's own validator, from the image the
  # extraction below pulls anyway (a second in that job, measured). --strict:
  # without it a deprecated option is a warning and the step is green
  # (measured on `regexManagers`). What it cannot see offline is a preset
  # name: `config:recomended` validates (measured) — presets are resolved
  # against github.com, at run time. Then every pin is one Renovate extracts —
  # the `# renovate:` comments and the SteVe tag examples in the Markdown
  # files, which have no comment to hang off and would otherwise freeze
  # silently the day a README edit leaves their shape. Extraction only: no
  # datasource, no branch, nothing written.
  renovate-extract:
    name: renovate.json validates and every pin is extracted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No file argument: given one, the validator reads it as *global* config
      # (the bot's own), not as a repository's (measured).
      - run: |
          docker run --rm -v "${PWD}:/repo" -w /repo "${RENOVATE_IMAGE}" renovate-config-validator --strict
      - run: ./hack/renovate-extract-check.sh
